name: push

on:
 push:
   branches: [ main ]

jobs:
  forntend:
     # setup frontend
     runs-on: ubuntu-latest 
     steps:
       - name: checkout the code
         uses: actions/checkout@v6

       - name: Use Node.js 
         uses: actions/setup-node@v7
         with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            
       - run: npm ci
       - run: npm run build --if-present
       - run: npm test

       - name: Install dependencies
         run: npm ci

       - name: Run lint check
         run: npm run lint

         

     
        




